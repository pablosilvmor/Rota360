<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Rota 360 - Gestão de Frota</title>

    <!-- Web App Manifest & PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rota 360" />
    <meta name="theme-color" content="#14181b" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="full-screen" content="yes" />
    <meta name="browsermode" content="application" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // Script profissional de limpeza e reset único para atualizar usuários travados no cache anterior
        var RESET_KEY = 'rota360_pwa_reset_v28_final_blast';
        try {
          if (!localStorage.getItem(RESET_KEY)) {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister();
                }
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var i = 0; i < names.length; i++) {
                  caches.delete(names[i]);
                }
              });
            }
            localStorage.setItem(RESET_KEY, 'true');
            console.log('PWA: Cache limpo com sucesso! Recarregando aplicação...');
            setTimeout(function() {
              window.location.reload(true);
            }, 600);
          }
        } catch (err) {
          console.error('Falha ao limpar cache:', err);
        }

        if ('serviceWorker' in navigator) {
          // Escutar comando de FORCE_RELOAD do Service Worker ativo
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'FORCE_RELOAD') {
              console.log('SW solicitou recarga forçada para nova versão:', event.data.version);
              window.location.reload(true);
            }
          });

          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
              console.log('SW Registered successfully:', reg.scope);
              
              // Se houver uma atualização no Service Worker em segundo plano, limpar cache e atualizar
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed') {
                      if (navigator.serviceWorker.controller) {
                        console.log('Novo Service Worker instalado! Limpando cache e atualizando...');
                        if (window.caches) {
                          caches.keys().then(function(names) {
                            names.forEach(function(name) {
                              caches.delete(name);
                            });
                          });
                        }
                        setTimeout(function() {
                          window.location.reload(true);
                        }, 500);
                      }
                    }
                  });
                }
              });

              // Forçar verificação de atualizações no Service Worker
              reg.update();
            }).catch(function(err) {
              console.error('SW Registration failed:', err);
            });
          });
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (String(event.reason).includes('WebSocket') || String(event.reason.message || '').includes('WebSocket'))) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
