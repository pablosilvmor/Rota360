<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rota 360 - Gestão de Frota</title>

    <!-- Web App Manifest & PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rota 360" />
    <meta name="application-name" content="Rota 360" />
    <meta name="theme-color" content="#14181b" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.imgur.com/1DaE4Bm.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://i.imgur.com/1DaE4Bm.png" />
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/1DaE4Bm.png" />
    <link rel="apple-touch-icon" href="https://i.imgur.com/1DaE4Bm.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.imgur.com/1DaE4Bm.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="https://i.imgur.com/1DaE4Bm.png" />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (String(event.reason).includes('WebSocket') || String(event.reason.message || '').includes('WebSocket'))) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
